      - oauth2:
        - Apps.Read
      operationId: getApiAppsV1Categories
      x-operation-id-source: derived
  /api/apps/v1/customfields:
    get:
      tags:
      - Applications
      summary: List application custom fields
      description: 'Returns the application custom fields defined for your organization. Use the field

        `lookupKey` values as the keys of the `customFields` object when creating or

        updating an application.


        **Required scope:** `Apps.Read` (Read-only access to applications)'
      parameters:
      - name: filter
        in: query
        description: A SCIM-style filter expression restricting the items returned. See the Filtering section of the introduction for the operators and syntax; the filterable fields are listed per resource.
        schema:
          type: string
      - name: q
        in: query
        description: Free-text search across the resource's displayable fields.
        schema:
          type: string
      - name: since
        in: query
        description: Only return items modified at or after this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only return items modified at or before this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        description: Opaque pagination cursor supplied by SaaS Manager via the `link` response header and the `next` field.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return per page (default 100, maximum 1000).
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAppFieldPage'
              example:
                results:
                - id: 60718293a1b2c3d4e5f60001
                  name: Business Unit
                  lookupKey: businessUnit
                  type: Text
                  showInAppHub: true
                  showInReporting: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - Apps.Read
      operationId: getApiAppsV1Customfields
      x-operation-id-source: derived
components:
  schemas:
    UserInfo:
      type: object
      properties:
        userId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
      additionalProperties: false
    CompactVendor:
      type: object
      properties:
        id:
          type: string
          description: The vendor's id
        name:
          type: string
          description: The vendor's name
      additionalProperties: false
      description: An app vendor
    Role:
      type: object
      properties:
        name:
          type: string
          description: The role name
        members:
          type: array
          items:
            $ref: '#/components/schemas/RoleMember'
          description: Users who possess this role
      additionalProperties: false
      description: A role
    AppFieldOption:
      type: object
      properties:
        id:
          type: string
          description: The option's ID, used as its value
        label:
          type: string
          description: The option's display label
      additionalProperties: false
      description: An option that an option-type custom field can take
    CustomerAppFieldType:
      enum:
      - Number
      - Text
      - Option
      - Date
      - Link
      - Person
      - Email
      - Currency
      type: string
    App:
      type: object
      properties:
        id:
          type: string
          description: The application's unique ID
        name:
          type: string
          description: The application name
        description:
          type: string
          description: A description of the application
        instanceName:
          type: string
          description: The instance name, used to distinguish multiple instances of the same application
        status:
          enum:
          - New
          - InReview
          - Managed
          - Accepted
          - Ignored
          - PlanToClose
          - Closed
          type: string
          description: The application's status in SaaS Manager.
        riskLevel:
          type: string
          description: 'Optional OAuth access risk level: Low, Medium or High'
        vendor:
          allOf:
          - $ref: '#/components/schemas/CompactVendor'
          description: The application's vendor
        licenses:
          type: array
          items:
            $ref: '#/components/schemas/License'
          description: The application's license plans
        customFields:
          type: object
          additionalProperties: {}
          description: 'Custom field values, keyed by the field''s lookup key. Each value is the field''s value directly: a string (text/single-select), a number, an ISO-8601 date, or an array of strings (multi-select).'
        createdBy:
          allOf:
          - $ref: '#/components/schemas/UserInfo'
          description: The user that created the application record
        createdDtm:
          type: string
          description: The timestamp for when the application record was created
          format: date-time
        deleted:
          type: boolean
          description: Whether the application has been deleted
        lastModifiedDtm:
          type: string
          description: The timestamp for when the application record was last modified
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: The application's owner roles and their members
        isGlobal:
          type: boolean
          description: Whether the application is recognised in the global application catalog
        mainCategory:
          allOf:
          - $ref: '#/components/schemas/Tag'
          description: The application's primary category
        otherCategories:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: The application's additional categories
        domains:
          type: array
          items:
            type: string
          description: The application's domains
        logoUrl:
          type: string
          description: A URL for the application's logo
        signOnUrl:
          type: string
          description: The application's single sign-on URL
        links:
          allOf:
          - $ref: '#/components/schemas/AppLinks'
          description: Links to pages containing application details
      additionalProperties: false
      description: An application
    AppField:
      type: object
      properties:
        id:
          type: string
          description: The custom field's unique ID
        name:
          type: string
          description: The custom field's display name
        lookupKey:
          type: string
          description: The lookup key used as the field's key in the customFields object
        type:
          allOf:
          - $ref: '#/components/schemas/CustomerAppFieldType'
          description: The custom field's value type
        options:
          type: array
          items:
            $ref: '#/components/schemas/AppFieldOption'
          description: For option-type fields, the available options
        showInAppHub:
          type: boolean
          description: Whether the field is shown in the App Hub
        showInReporting:
          type: boolean
          description: Whether the field is available in reporting
      additionalProperties: false
      description: An application custom field definition
    Error:
      type: object
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        status:
          type: integer
          description: The HTTP status code.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation errors keyed by field name. Present on 400 responses.
        traceId:
          type: string
          description: A trace identifier for correlating the error with SaaS Manager support.
      additionalProperties: false
      description: An error response (RFC 7807 problem details).
    AppAccount:
      type: object
      properties:
        id:
          type: string
          description: The account's unique ID
        name:
          type: string
          description: The account holder's name
        email:
          type: string
          description: The account's email address
        status:
          enum:
          - Active
          - Inactive
          - NotProvisioned
          - Suspended
          - Deleted
          - Unknown
          - WaitingToProvision
          type: string
          description: The account's status on the application
        lastLoginDtm:
          type: string
          description: The timestamp of the account's last login
          format: date-time
        deleted:
          type: boolean
          description: Whether the account has been deleted
        lastModifiedDtm:
          type: string
          description: The timestamp for when the account record was last modified
          format: date-time
      additionalProperties: false
      description: An account (user) on an application
    RoleMember:
      type: object
      properties:
        userId:
          type:
          - string
          - 'null'
          description: The user's id
        name:
          type:
          - string
          - 'null'
          description: The user's name
        email:
          type:
          - string
          - 'null'
          description: The user's e-mail address
      additionalProperties: false
      description: A member of a role
    Tag:
      type: object
      properties:
        id:
          type: string
          description: The tag id
        name:
          type: string
          description: The tag
        nameIntl:
          type: object
          additionalProperties:
            type: string
          description: International version of the tag
      additionalProperties: false
      description: A tag
    License:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The name of the license
          readOnly: true
        licensePlanId:
          type:
          - string
          - 'null'
          description: The licence plan id
          readOnly: true
        startDate:
          type: string
          description: The date the license started
          format: date-time
          readOnly: true
        renewalDate:
          type:
          - string
          - 'null'
          description: The renewal date of the license
          format: date-time
          readOnly: true
        terminatedDate:
          type:
          - string
          - 'null'
          description: The date the license was terminated
