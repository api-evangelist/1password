  /api/apps/v1/{appId}/users:
    get:
      tags:
      - Applications
      summary: List application accounts
      description: 'Returns a paginated list of the accounts (users) on a given application. Follow the

        `next` link to page through large result sets.


        **Required scope:** `Apps.Users.Read` (Read-only access to application accounts)'
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: 'A SCIM-style filter expression restricting the items returned. See the Filtering section of the introduction for the operators and syntax; the filterable fields are listed per resource.


          **Filterable fields**


          - **string:** `email`, `id`, `name`, `status`

          - **date:** `lastLoginDtm`, `lastModifiedDtm`

          - **boolean:** `deleted`



          **Filter examples**


          - `status eq "Active"` — Accounts that are currently active

          - `email co "@example.com"` — Accounts with an example.com email address

          - `lastLoginDtm ge "2024-01-01"` — Accounts that logged in on or after 1 Jan 2024

          - `not (lastLoginDtm pr)` — Accounts that have never logged in

          - `deleted eq true` — Show deleted accounts (excluded by default)'
        schema:
          type: string
      - name: q
        in: query
        description: Free-text search across the resource's displayable fields.
        schema:
          type: string
      - name: since
        in: query
        description: Only return items modified at or after this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only return items modified at or before this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        description: Opaque pagination cursor supplied by SaaS Manager via the `link` response header and the `next` field.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return per page (default 100, maximum 1000).
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAppUserPage'
              example:
                next: https://app.trelica.com/api/apps/v1/9425963fcd38ed972d209b49/users?after=eyJpZCI6IjY0NjlmMGIzZTJhMWM0ZDVmNmE3YjgwMSJ9&limit=100
                results:
                - id: 6469f0b3e2a1c4d5f6a7b801
                  name: John Doe
                  email: john.doe@example.com
                  status: Active
                  lastLoginDtm: '2024-05-24T09:12:33Z'
                  deleted: false
                  lastModifiedDtm: '2024-05-26T01:03:26Z'
                - id: 6469f0b3e2a1c4d5f6a7b802
                  name: Jane Smith
                  email: jane.smith@example.com
                  status: Active
                  lastLoginDtm: '2024-05-25T16:45:02Z'
                  deleted: false
                  lastModifiedDtm: '2024-05-25T16:45:02Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
