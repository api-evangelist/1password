        least one field must be supplied.


        **Required scope:** `Apps.Write` (Write access to applications)'
      parameters:
      - name: id
        in: path
        description: The application's SaaS Manager ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppPatch'
            example:
              instanceName: EMEA Sales
              status: Accepted
