      security:
      - oauth2:
        - Assets.Read
      operationId: getApiAssetsV1ById
      x-operation-id-source: derived
    put:
      tags:
      - Devices
      summary: Create or replace a device
      description: 'Creates a new device, or fully replaces an existing one when an ID is supplied (in the route

        or in the body). When creating, `hardwareVendor` and `modelName` are required.

        Assign the device to a person with `assignedToEmail` and to a location with

        `locationName` (a location is created if needed). `netPrice` is converted to your

        base currency.


        **Required scope:** `Assets.Write` (Write access to devices)'
      parameters:
      - name: id
        in: path
        description: Optional SaaS Manager device ID to replace. If omitted a new device is created.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
            example:
              id: 646fcb4fb829ba9df2a94471
              status: Deployed
              statusType: Deployed
              hardwareVendor: Apple Inc.
              modelName: MacBook Pro (16-inch, 2021)
              serialNumber: KOGITG04P5
              assetTag: A0000002
              purchasedDate: '2016-03-06T00:00:00Z'
              warrantyExpirationDate: '2017-03-06T00:00:00Z'
              lifespanExpirationDate: '2019-03-06T00:00:00Z'
              assignedTo:
                userId: 6a127db661b442c1afdd77611ad99824
                name: Joshua Burns
                email: joshua.burns@example.com
              assignedToEmail: joshua.burns@example.com
              netPrice: 1615.0
              netPriceCurrency: USD
              platform: Mac
              isEncrypted: false
              customFields:
                user_department: Engineering
                user_ram_gb: 32.0
                user_accessories:
                - Charger
                - Dock
              createdBy:
                userId: b1fb51a7c13f4cbf832b304348c8270e
                name: System
                email: admin@example.com
              createdDtm: '2023-05-25T20:55:43.048Z'
              lastModifiedBy:
                userId: b1fb51a7c13f4cbf832b304348c8270e
                name: System
                email: admin@example.com
              lastModifiedDtm: '2024-05-27T01:03:26.679Z'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                id: 646fcb4fb829ba9df2a94471
                status: Deployed
                statusType: Deployed
                hardwareVendor: Apple Inc.
                modelName: MacBook Pro (16-inch, 2021)
                serialNumber: KOGITG04P5
                assetTag: A0000002
