                createdDtm: '2023-05-25T20:55:43.048Z'
                lastModifiedBy:
                  userId: b1fb51a7c13f4cbf832b304348c8270e
                  name: System
                  email: admin@example.com
                lastModifiedDtm: '2024-05-27T01:03:26.679Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
