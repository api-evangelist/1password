  /api/assets/v1/customfields:
    get:
      tags:
      - Devices
      summary: List device custom fields
      description: 'Returns the device custom fields defined for your organization. Use the field

        `lookupKey` values as the keys of the `customFields` object when creating or

        updating a device.


        **Required scope:** `Assets.Read` (Read-only access to devices)'
      parameters:
      - name: filter
        in: query
        description: A SCIM-style filter expression restricting the items returned. See the Filtering section of the introduction for the operators and syntax; the filterable fields are listed per resource.
        schema:
          type: string
      - name: q
        in: query
        description: Free-text search across the resource's displayable fields.
        schema:
          type: string
      - name: since
        in: query
        description: Only return items modified at or after this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only return items modified at or before this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        description: Opaque pagination cursor supplied by SaaS Manager via the `link` response header and the `next` field.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return per page (default 100, maximum 1000).
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCustomFieldPage'
              example:
                results:
                - id: 60718293a1b2c3d4e5f60400
                  name: Memory (GB)
                  lookupKey: memoryGb
                  type: Number
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - Assets.Read
      operationId: getApiAssetsV1Customfields
      x-operation-id-source: derived
components:
  schemas:
    DevicePlatform:
      enum:
      - Mac
      - Windows
      - iOS
      - Android
      - ChromeOS
      - Linux
      type: string
    DeviceFieldOption:
      type: object
      properties:
        id:
          type: string
          description: The option's ID, used as its value
        label:
          type: string
          description: The option's display label
      additionalProperties: false
      description: An option that an option-type custom field can take
    DeviceCustomFieldPage:
      type: object
      properties:
        next:
          type: string
          description: The URL of the next page of results. Absent when there are no more results.
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeviceField'
          description: The page of results.
      additionalProperties: false
    UserInfo:
      type: object
      properties:
        userId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
      additionalProperties: false
    Error:
      type: object
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        status:
          type: integer
          description: The HTTP status code.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation errors keyed by field name. Present on 400 responses.
        traceId:
          type: string
          description: A trace identifier for correlating the error with SaaS Manager support.
      additionalProperties: false
      description: An error response (RFC 7807 problem details).
    DeviceAssignee:
      type: object
      properties:
        userId:
          type:
          - string
          - 'null'
          description: The assignee's SaaS Manager person ID
        name:
          type:
          - string
          - 'null'
          description: The assignee's name
        email:
          type:
          - string
          - 'null'
          description: The assignee's email address
      additionalProperties: false
      description: The person an asset is assigned to
    DeviceField:
      type: object
      properties:
        id:
          type: string
          description: The custom field's unique ID
        providerId:
          type: string
          description: The ID of the integration that provides the field, if any
        name:
          type: string
          description: The custom field's display name
        lookupKey:
          type: string
          description: The lookup key used as the field's key in the customFields object
        type:
          allOf:
          - $ref: '#/components/schemas/DeviceCustomFieldType'
          description: The custom field's value type
        options:
          type: array
          items:
            $ref: '#/components/schemas/DeviceFieldOption'
          description: For option-type fields, the available options
      additionalProperties: false
      description: An asset custom field definition
    Device:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
