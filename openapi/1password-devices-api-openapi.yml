    delete:
      tags:
      - Devices
      summary: Delete a device
      description: 'Deletes the device with the given SaaS Manager ID.


        **Required scope:** `Assets.Write` (Write access to devices)'
      parameters:
      - name: id
        in: path
        description: The device's SaaS Manager ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
