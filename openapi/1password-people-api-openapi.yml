openapi: 3.2.0
info:
  title: SaaS Manager People API
  description: 'By accessing or using 1Password Developer Tools, you agree to the API and SDK Terms of Service. ---


    The SaaS Manager public REST API lets you read and manage your applications, people, teams, contracts, devices, workflows and audit log programmatically. Resources are grouped by area (see the navigation). The conventions below apply across the whole API. ## Regions and base URL


    SaaS Manager is hosted in multiple regions. Pick the base URL for your tenant''s region from the **Servers** dropdown — `https://app.trelica.com` (United States) or `https://eu.trelica.com` (Europe). Endpoint URLs throughout this reference use whichever server you select. ## Authentication


    Every request must send an `Authorization` header carrying an OAuth 2.0 access token, prefixed with `Bearer`:


    ```

    Authorization: Bearer

    ```


    Obtain a token using either the **Client Credentials** flow (machine-to-machine) or the **Authorization Code** flow (acting on behalf of a user). The scopes granted to your token determine which endpoints you may call — see Scopes. Access tokens expire. When a token is missing, invalid or expired you receive `401 Unauthorized`; inspect the `WWW-Authenticate` response header for detail, for example:


    ```

    Bearer error="invalid_token", error_description="The token expired at ''12/23/2020 10:27:15''"

    ```


    If you used the Authorization Code flow with the `offline_access` scope, use your refresh token to obtain a new access token. A `403 Forbidden` means the token is valid but lacks the scope required by the endpoint. ## Dates and times


    Dates and date/times are sent and returned in RFC 3339 format (essentially ISO 8601), for example `2020-12-25` (midnight) or `2020-12-25T10:50:00Z`. Field names ending in `Dtm` carry a meaningful time component; field names ending in `Date` are date-only. ## Optional fields and null


    Responses omit fields that have no value — you will see the field absent rather than returned as `null`. When creating or replacing a resource (`PUT`), any field you omit is cleared. With `PATCH`, omitting a field leaves it unchanged, whereas sending it as `null` clears it. ## Pagination


    List endpoints are paginated and return at most 100 results by default. Request a different upper bound with the `limit` query parameter (maximum 1000) — you may receive fewer than requested. Request the next page with the `after` query parameter, passing the opaque cursor token that SaaS Manager supplies. The response''s `next` field (and the `link` response header, `rel="next"`) contains the full URL for the next page:


    ```json

    {

    "next": "https://app.trelica.com/api/people/v1?after=&limit=100",

    "results": [ { /* ... */ } ]

    }

    ```


    Keep requesting pages until no further results are returned. (User data exposed over SCIM uses the SCIM `startIndex`/`count` pagination scheme instead.)


    ## Filtering


    Many list endpoints accept a `filter` query parameter (URL-encoded) based on the SCIM filtering specification. A filter is one or more expressions — an attribute name, an operator, and an optional value — combined with `and`, `or`, `not`, and grouped with parentheses. Attribute names match the JSON returned and may use dot notation for nested attributes

    (e.g. `createdBy.email`). For an attribute that is an **array of objects**, put a sub-expression in

    brackets — the item matches when *any* element satisfies it: `teams[name eq "Developers"]` or

    `teams[id eq "5f8d0a1b2c3d4e5f60718293"]`. Values are strings (double-quoted), integers, dates

    (double-quoted, RFC 3339) or booleans. Some list endpoints also accept a free-text `q` parameter

    that searches the resource''s displayable fields. Soft-deleted entities are excluded by default; include them with a filter that references `deleted` (e.g. `filter=deleted eq true`).'
  contact:
    name: 1Password SaaS Manager Support
    email: saasmanager@1password.com
  version: v1
servers:
- url: https://app.trelica.com
  description: United States
- url: https://eu.trelica.com
  description: Europe
tags:
- name: People
  description: List, search and manage the people in your organization.
paths:
  /api/people/v1:
    get:
      tags:
      - People
      summary: List people
      description: 'Returns a paginated list of the people in your organization. Use `filter` and

        `q` to narrow the results, and follow the `next` link (also provided in the

        `link` response header) to page through large result sets.


        **Required scope:** `People.Read` (Read-only access to people and teams)'
      parameters:
      - name: filter
        in: query
        description: 'A SCIM-style filter expression restricting the items returned. See the Filtering section of the introduction for the operators and syntax; the filterable fields are listed per resource.


          **Filterable fields**


          - **string:** `aliases`, `costCenter`, `costCenterId`, `createdBy.email`, `createdBy.name`, `createdBy.userId`, `email`, `employeeId`, `firstName`, `id`, `jobTitle`, `lastModifiedBy.email`, `lastModifiedBy.name`, `lastModifiedBy.userId`, `lastName`, `location`, `locationCountryCode`, `locationId`, `locationTimezone`, `loginName`, `organizationalUnit`, `personType`, `personalAddress.city`, `personalAddress.countryCode`, `personalAddress.stateOrProvince`, `personalAddress.streetAddress1`, `personalAddress.streetAddress2`, `personalAddress.zipOrPostalCode`, `phoneNumber`, `status`, `teams[id]`, `teams[name]`, `timezone`

          - **date:** `createdDtm`, `lastModifiedDtm`, `leavingDate`, `startDate`

          - **custom fields:** `customFields.<name>`


          **Filter examples**


          - `email eq "john.doe@example.com"` — The person with this email address

          - `firstName sw "Jan"` — People whose first name starts with "Jan"

          - `teams[name eq "Developers"]` — People in the Developers team

          - `not (leavingDate pr)` — People with no leaving date

          - `status eq "Active" and lastModifiedDtm ge "2024-01-01"` — Active people modified on or after 1 Jan 2024'
        schema:
          type: string
      - name: q
        in: query
        description: Free-text search across the resource's displayable fields.
        schema:
          type: string
      - name: since
        in: query
        description: Only return items modified at or after this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only return items modified at or before this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        description: Opaque pagination cursor supplied by SaaS Manager via the `link` response header and the `next` field.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return per page (default 100, maximum 1000).
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
              example:
                next: https://app.trelica.com/api/people/v1?after=eyJpZCI6IjEyM2U0NTY3ZTg5YjEyZDMifQ&limit=100
                results:
                - id: 123e4567e89b12d3a456426614174000
                  employeeType: Part-time
                  personType: Employee
                  aliases:
                  - john.doe@example.com
                  - john@example.com
                  - j.doe@example.com
                  - johnny.d@example.com
                  userName: johndoe123
                  firstName: John
                  lastName: Doe
                  email: john.doe@example.com
                  jobTitle: Customer Success Manager
                  organizationalUnit: /
                  loginName: johndoe
                  employeeId: '123'
                  status: Active
                  lineManager:
                    id: 765e4321b98e21d3b456426614174000
                    personType: User
                    name: Jane Smith
                    email: jane.smith@example.com
                  teams:
                  - id: 65207c3ffa0d2abb07955316
                    name: Customer Success
                  createdBy:
                    userId: 321cba98-765e-4321-0d3b-456789abcdef
                    name: System
                    email: admin@example.com
                  createdDtm: '2020-03-09T06:09:26Z'
                  lastModifiedBy:
                    userId: 321cba98-765e-4321-0d3b-456789abcdef
                    name: System
                    email: admin@example.com
                  lastModifiedDtm: '2024-05-26T01:01:43Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - People.Read
      operationId: getApiPeopleV1
      x-operation-id-source: derived
  /api/people/v1/{id}:
    get:
      tags:
      - People
      summary: Get a person
      description: 'Fetches a single person by their SaaS Manager ID (a UUID) or by email address. If an email

        address matches more than one person a 409 Conflict is returned.


        **Required scope:** `People.Read` (Read-only access to people and teams)'
      parameters:
      - name: id
        in: path
        description: The person's SaaS Manager ID (UUID) or an email address.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
              example:
                id: 123e4567e89b12d3a456426614174000
                employeeType: Part-time
                personType: Employee
                aliases:
                - john.doe@example.com
                - john@example.com
                - j.doe@example.com
                - johnny.d@example.com
                userName: johndoe123
                firstName: John
                lastName: Doe
                email: john.doe@example.com
                jobTitle: Customer Success Manager
                organizationalUnit: /
                loginName: johndoe
                employeeId: '123'
                status: Active
                lineManager:
                  id: 765e4321b98e21d3b456426614174000
                  personType: User
                  name: Jane Smith
                  email: jane.smith@example.com
                teams:
                - id: 65207c3ffa0d2abb07955316
                  name: Customer Success
                createdBy:
                  userId: 321cba98-765e-4321-0d3b-456789abcdef
                  name: System
                  email: admin@example.com
                createdDtm: '2020-03-09T06:09:26Z'
                lastModifiedBy:
                  userId: 321cba98-765e-4321-0d3b-456789abcdef
                  name: System
                  email: admin@example.com
                lastModifiedDtm: '2024-05-26T01:01:43Z'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found.
                status: 404
                detail: The requested resource does not exist or you do not have access to it.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Conflict.
                status: 409
                detail: The request conflicts with the current state (for example, the resource already exists).
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - People.Read
      operationId: getApiPeopleV1ById
      x-operation-id-source: derived
    put:
      tags:
      - People
      summary: Create or replace a person
      description: 'Creates a new person, or fully replaces an existing one when an ID is supplied (in the

        route or in the body). When creating, the email address must not already be in use.

        Set the line manager with lineManagerId or lineManagerEmail. Team membership is replaced

        wholesale: supply either teams (by ID or name) or teamIds (not both) — omitting both

        removes the person''s manually-assigned teams.


        **Required scope:** `People.Write` (Write access to people and teams)'
      parameters:
      - name: id
        in: path
        description: Optional SaaS Manager person ID (UUID) to replace. If omitted a new person is created.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonPut'
            example:
              teamIds:
              - 65207c3ffa0d2abb07955316
              lineManagerEmail: jane.smith@example.com
              employeeType: Full-time
              personType: Employee
              firstName: John
              lastName: Doe
              email: john.doe@example.com
              jobTitle: Customer Success Manager
              location: London, UK
              costCenter: Customer Success
              employeeId: '123'
              status: New
              startDate: '2021-06-01T00:00:00Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
              example:
                id: 123e4567e89b12d3a456426614174000
                employeeType: Part-time
                personType: Employee
                aliases:
                - john.doe@example.com
                - john@example.com
                - j.doe@example.com
                - johnny.d@example.com
                userName: johndoe123
                firstName: John
                lastName: Doe
                email: john.doe@example.com
                jobTitle: Customer Success Manager
                organizationalUnit: /
                loginName: johndoe
                employeeId: '123'
                status: Active
                lineManager:
                  id: 765e4321b98e21d3b456426614174000
                  personType: User
                  name: Jane Smith
                  email: jane.smith@example.com
                teams:
                - id: 65207c3ffa0d2abb07955316
                  name: Customer Success
                createdBy:
                  userId: 321cba98-765e-4321-0d3b-456789abcdef
                  name: System
                  email: admin@example.com
                createdDtm: '2020-03-09T06:09:26Z'
                lastModifiedBy:
                  userId: 321cba98-765e-4321-0d3b-456789abcdef
                  name: System
                  email: admin@example.com
                lastModifiedDtm: '2024-05-26T01:01:43Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found.
                status: 404
                detail: The requested resource does not exist or you do not have access to it.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Conflict.
                status: 409
                detail: The request conflicts with the current state (for example, the resource already exists).
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - People.Write
      operationId: putApiPeopleV1ById
      x-operation-id-source: derived
    patch:
      tags:
      - People
      summary: Update selected details of a person
      description: 'Partially updates a person: only the fields present in the request body are changed.

        Omitting a field leaves it untouched, whereas sending an explicit `null` clears it.

        At least one field must be supplied.


        **Required scope:** `People.Write` (Write access to people and teams)'
      parameters:
      - name: id
        in: path
        description: The person's SaaS Manager ID (UUID) or an email address.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonPatch'
            example:
              jobTitle: Senior Customer Success Manager
              costCenter: Customer Success
              lineManagerEmail: jane.smith@example.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
              example:
                id: 123e4567e89b12d3a456426614174000
                employeeType: Part-time
                personType: Employee
                aliases:
                - john.doe@example.com
                - john@example.com
                - j.doe@example.com
                - johnny.d@example.com
                userName: johndoe123
                firstName: John
                lastName: Doe
                email: john.doe@example.com
                jobTitle: Customer Success Manager
                organizationalUnit: /
                loginName: johndoe
                employeeId: '123'
                status: Active
                lineManager:
                  id: 765e4321b98e21d3b456426614174000
                  personType: User
                  name: Jane Smith
                  email: jane.smith@example.com
                teams:
                - id: 65207c3ffa0d2abb07955316
                  name: Customer Success
                createdBy:
                  userId: 321cba98-765e-4321-0d3b-456789abcdef
                  name: System
                  email: admin@example.com
                createdDtm: '2020-03-09T06:09:26Z'
                lastModifiedBy:
                  userId: 321cba98-765e-4321-0d3b-456789abcdef
                  name: System
                  email: admin@example.com
                lastModifiedDtm: '2024-05-26T01:01:43Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found.
                status: 404
                detail: The requested resource does not exist or you do not have access to it.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Conflict.
                status: 409
                detail: The request conflicts with the current state (for example, the resource already exists).
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - People.Write
      operationId: patchApiPeopleV1ById
      x-operation-id-source: derived
  /api/people/v1/{id}/apps:
    get:
      tags:
      - People
      summary: List a person's applications
      description: 'Returns a paginated list of the applications a person has an account on, identified by their

        SaaS Manager ID or email address. If an email address matches more than one person a 409

        Conflict is returned.


        **Required scope:** `People.Read` (Read-only access to people and teams)'
      parameters:
      - name: id
        in: path
        description: The person's SaaS Manager ID (UUID) or an email address.
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: 'A SCIM-style filter expression restricting the items returned. See the Filtering section of the introduction for the operators and syntax; the filterable fields are listed per resource.


          **Filterable fields**


          - **string:** `appUser.email`, `appUser.id`, `appUser.name`, `appUser.status`, `app[status]`, `id`, `name`, `status`

          - **date:** `appUser.lastLoginDtm`, `appUser.lastModifiedDtm`

          - **boolean:** `appUser.deleted`



          **Filter examples**


          - `name sw "Sales"` — Applications whose name starts with "Sales"

          - `appUser.status eq "Active"` — Applications where the person''s account is active

          - `appUser.lastLoginDtm ge "2024-01-01"` — Applications the person logged in to on or after 1 Jan 2024'
        schema:
          type: string
      - name: q
        in: query
        description: Free-text search across the resource's displayable fields.
        schema:
          type: string
      - name: since
        in: query
        description: Only return items modified at or after this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only return items modified at or before this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        description: Opaque pagination cursor supplied by SaaS Manager via the `link` response header and the `next` field.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return per page (default 100, maximum 1000).
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonAppPage'
              example:
                results:
                - id: 9425963fcd38ed972d209b49
                  name: Asana
                  status: Managed
                  appUser:
                    id: 6469f0b3e2a1c4d5f6a7b801
                    name: John Doe
                    email: john.doe@example.com
                    status: Active
                    lastLoginDtm: '2024-05-24T09:12:33Z'
                    deleted: false
                    lastModifiedDtm: '2024-05-26T01:03:26Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found.
                status: 404
                detail: The requested resource does not exist or you do not have access to it.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Conflict.
                status: 409
                detail: The request conflicts with the current state (for example, the resource already exists).
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - People.Read
      operationId: getApiPeopleV1ByIdApps
      x-operation-id-source: derived
components:
  schemas:
    PersonStatus:
      enum:
      - New
      - Terminated
      - Active
      - Unknown
      type: string
    Team:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The team's unique ID. Omit when creating a team by name.
        name:
          type:
          - string
          - 'null'
          description: The team's name
      additionalProperties: false
      description: A team that a person can belong to
    PersonPersonValue:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        personType:
          allOf:
          - $ref: '#/components/schemas/PersonValueType'
        name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        externalId:
          type:
          - string
          - 'null'
      additionalProperties: false
    PersonAppPage:
      type: object
      properties:
        next:
          type: string
          description: The URL of the next page of results. Absent when there are no more results.
        results:
          type: array
          items:
            $ref: '#/components/schemas/PersonApp'
          description: The page of results.
      additionalProperties: false
    UserInfo:
      type: object
      properties:
        userId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
      additionalProperties: false
    Error:
      type: object
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        status:
          type: integer
          description: The HTTP status code.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
