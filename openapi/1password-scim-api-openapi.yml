openapi: 3.2.0
info:
  title: SaaS Manager SCIM API
  description: 'By accessing or using 1Password Developer Tools, you agree to the API and SDK Terms of Service. ---


    The SaaS Manager public REST API lets you read and manage your applications, people, teams, contracts, devices, workflows and audit log programmatically. Resources are grouped by area (see the navigation). The conventions below apply across the whole API. ## Regions and base URL


    SaaS Manager is hosted in multiple regions. Pick the base URL for your tenant''s region from the **Servers** dropdown — `https://app.trelica.com` (United States) or `https://eu.trelica.com` (Europe). Endpoint URLs throughout this reference use whichever server you select. ## Authentication


    Every request must send an `Authorization` header carrying an OAuth 2.0 access token, prefixed with `Bearer`:


    ```

    Authorization: Bearer

    ```


    Obtain a token using either the **Client Credentials** flow (machine-to-machine) or the **Authorization Code** flow (acting on behalf of a user). The scopes granted to your token determine which endpoints you may call — see Scopes. Access tokens expire. When a token is missing, invalid or expired you receive `401 Unauthorized`; inspect the `WWW-Authenticate` response header for detail, for example:


    ```

    Bearer error="invalid_token", error_description="The token expired at ''12/23/2020 10:27:15''"

    ```


    If you used the Authorization Code flow with the `offline_access` scope, use your refresh token to obtain a new access token. A `403 Forbidden` means the token is valid but lacks the scope required by the endpoint. ## Dates and times


    Dates and date/times are sent and returned in RFC 3339 format (essentially ISO 8601), for example `2020-12-25` (midnight) or `2020-12-25T10:50:00Z`. Field names ending in `Dtm` carry a meaningful time component; field names ending in `Date` are date-only. ## Optional fields and null


    Responses omit fields that have no value — you will see the field absent rather than returned as `null`. When creating or replacing a resource (`PUT`), any field you omit is cleared. With `PATCH`, omitting a field leaves it unchanged, whereas sending it as `null` clears it. ## Pagination


    List endpoints are paginated and return at most 100 results by default. Request a different upper bound with the `limit` query parameter (maximum 1000) — you may receive fewer than requested. Request the next page with the `after` query parameter, passing the opaque cursor token that SaaS Manager supplies. The response''s `next` field (and the `link` response header, `rel="next"`) contains the full URL for the next page:


    ```json

    {

    "next": "https://app.trelica.com/api/people/v1?after=&limit=100",

    "results": [ { /* ... */ } ]

    }

    ```


    Keep requesting pages until no further results are returned. (User data exposed over SCIM uses the SCIM `startIndex`/`count` pagination scheme instead.)


    ## Filtering


    Many list endpoints accept a `filter` query parameter (URL-encoded) based on the SCIM filtering specification. A filter is one or more expressions — an attribute name, an operator, and an optional value — combined with `and`, `or`, `not`, and grouped with parentheses. Attribute names match the JSON returned and may use dot notation for nested attributes

    (e.g. `createdBy.email`). For an attribute that is an **array of objects**, put a sub-expression in

    brackets — the item matches when *any* element satisfies it: `teams[name eq "Developers"]` or

    `teams[id eq "5f8d0a1b2c3d4e5f60718293"]`. Values are strings (double-quoted), integers, dates

    (double-quoted, RFC 3339) or booleans. Some list endpoints also accept a free-text `q` parameter

    that searches the resource''s displayable fields. Soft-deleted entities are excluded by default; include them with a filter that references `deleted` (e.g. `filter=deleted eq true`).'
  contact:
    name: 1Password SaaS Manager Support
    email: saasmanager@1password.com
  version: v1
servers:
- url: https://app.trelica.com
  description: United States
- url: https://eu.trelica.com
  description: Europe
tags:
- name: SCIM
  description: 'Provision and manage users via the SCIM 2.0 protocol (RFC 7644). These endpoints follow the SCIM standard rather than the conventions used by the rest of the SaaS Manager API: they use `startIndex`/`count` paging, return a SCIM `ListResponse` envelope, identify schemas with `urn:` URIs, and exchange `application/scim+json`. The `ResourceTypes` endpoints support SCIM discovery (RFC 7643).'
paths:
  /api/scim/v2/ResourceTypes:
    get:
      tags:
      - SCIM
      summary: List resource types
      description: 'Returns the SCIM 2.0 resource types this provider exposes (RFC 7643), in a SCIM `ListResponse`

        envelope. SCIM clients read this during discovery. Per the SCIM standard, supplying a `filter`

        is not permitted.'
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimResourceTypeScimListResponse'
              example:
                totalResults: 1
                itemsPerPage: 100
                startIndex: 0
                schemas:
                - urn:ietf:params:scim:api:messages:2.0:ListResponse
                Resources:
                - schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:ResourceType
                  name: User
                  endpoint: /api/scim/v2/User
                  description: User Account
                  schema: urn:ietf:params:scim:schemas:core:2.0:User
                  meta:
                    location: https://app.trelica.com/api/scim/v2/ResourceTypes/User
                    resourceType: ResourceType
      operationId: getApiScimV2ResourceTypes
      x-operation-id-source: derived
  /api/scim/v2/Users:
    get:
      tags:
      - SCIM
      summary: List users
      description: 'Lists users with SaaS Manager access, following the SCIM 2.0 protocol (RFC 7644). Results

        are returned in a SCIM `ListResponse` envelope (`totalResults`, `itemsPerPage`,

        `startIndex`, `Resources`).


        Paging is SCIM-style — 1-based `startIndex` plus `count` (default and maximum 100) — not

        the cursor paging used elsewhere in the SaaS Manager API. An optional SCIM `filter`

        expression (e.g. `userName eq "john.doe@example.com"`) narrows the results.'
      parameters:
      - name: startIndex
        in: query
        description: The 1-based index of the first result to return.
        schema:
          type: integer
          format: int32
          default: 0
      - name: count
        in: query
        description: The maximum number of results per page (default and maximum 100).
        schema:
          type: integer
          format: int32
      - name: filter
        in: query
        description: 'An optional SCIM filter expression ([RFC 7644 §3.4.2.2](https://tools.ietf.org/html/rfc7644#section-3.4.2.2)).

          Examples: `userName eq "john.doe@example.com"` (a specific user); `active eq true`

          (enabled users); `userName sw "john"` (user names starting with "john");

          `name.familyName eq "Smith"`.'
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUserScimListResponse'
              example:
                totalResults: 2
                itemsPerPage: 100
                startIndex: 1
                schemas:
                - urn:ietf:params:scim:api:messages:2.0:ListResponse
                Resources:
                - schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  userName: erika.mustermann@example.com
                  name:
                    formatted: Erika Mustermann
                    familyName: Mustermann
                    givenName: Erika
                  displayName: Erika Mustermann
                  title: Customer Success Manager
                  preferredLanguage: en-GB
                  locale: en-GB
                  active: true
                  emails:
                  - primary: true
                    type: work
                    value: erika.mustermann@example.com
                  roles:
                  - value: Admin
                    display: Admin
                    primary: false
                  id: 8089ac9b31841227d4aee4f0adecd81f
                  meta:
                    created: '2019-01-01T00:00:00Z'
                    lastModified: '2024-12-06T14:58:12Z'
                    resourceType: User
                - schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                  userName: steve.cross@example.com
                  name:
                    formatted: Steve Cross
                    familyName: Cross
                    givenName: Steve
                  displayName: Steve Cross
                  preferredLanguage: en-GB
                  locale: en-GB
                  active: true
                  emails:
                  - primary: true
                    type: work
                    value: steve.cross@example.com
                  roles:
                  - value: App catalog
                    display: App catalog
                    primary: false
                  - value: App management
                    display: App management
                    primary: false
                  id: b1c2d3e4f5061728394a5b6c7d8e9f00
                  meta:
                    created: '2020-03-09T06:09:26Z'
                    lastModified: '2024-05-26T01:01:43Z'
                    resourceType: User
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      operationId: getApiScimV2Users
      x-operation-id-source: derived
    post:
      tags:
      - SCIM
      summary: Create a user
      description: 'Creates a user, following the SCIM 2.0 protocol (RFC 7644). `userName` is required and must

        belong to a domain verified for your organization; it must not already be in use (a

        duplicate returns 409). Server-controlled fields (`id`, `meta`) are ignored on the request

        and set by the service. Returns 201 with the created user and a `Location` header.


        **Required scope:** `Users.Write` (Write access to users with access to SaaS Manager)'
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUser'
            example:
              schemas:
              - urn:ietf:params:scim:schemas:core:2.0:User
              userName: erika.mustermann@example.com
              name:
                formatted: Erika Mustermann
                familyName: Mustermann
                givenName: Erika
              displayName: Erika Mustermann
              title: Customer Success Manager
              preferredLanguage: en-GB
              locale: en-GB
              active: true
              emails:
              - primary: true
                type: work
                value: erika.mustermann@example.com
              roles:
              - value: Admin
                display: Admin
                primary: false
              id: 8089ac9b31841227d4aee4f0adecd81f
              meta:
                created: '2019-01-01T00:00:00Z'
                lastModified: '2024-12-06T14:58:12Z'
                resourceType: User
        required: true
      responses:
        '201':
          description: Created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
              example:
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
                userName: erika.mustermann@example.com
                name:
                  formatted: Erika Mustermann
                  familyName: Mustermann
                  givenName: Erika
                displayName: Erika Mustermann
                title: Customer Success Manager
                preferredLanguage: en-GB
                locale: en-GB
                active: true
                emails:
                - primary: true
                  type: work
                  value: erika.mustermann@example.com
                roles:
                - value: Admin
                  display: Admin
                  primary: false
                id: 8089ac9b31841227d4aee4f0adecd81f
                meta:
                  created: '2019-01-01T00:00:00Z'
                  lastModified: '2024-12-06T14:58:12Z'
                  resourceType: User
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '409':
          description: Conflict
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Conflict.
                status: 409
                detail: The request conflicts with the current state (for example, the resource already exists).
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - Users.Write
      operationId: postApiScimV2Users
      x-operation-id-source: derived
  /api/scim/v2/Users/{userId}:
    get:
      tags:
      - SCIM
      summary: Get a user
      description: Fetches a single user by SCIM resource ID, following the SCIM 2.0 protocol (RFC 7644).
      parameters:
      - name: userId
        in: path
        description: The user's SCIM resource ID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
              example:
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
                userName: erika.mustermann@example.com
                name:
                  formatted: Erika Mustermann
                  familyName: Mustermann
                  givenName: Erika
                displayName: Erika Mustermann
                title: Customer Success Manager
                preferredLanguage: en-GB
                locale: en-GB
                active: true
                emails:
                - primary: true
                  type: work
                  value: erika.mustermann@example.com
                roles:
                - value: Admin
                  display: Admin
                  primary: false
                id: 8089ac9b31841227d4aee4f0adecd81f
                meta:
                  created: '2019-01-01T00:00:00Z'
                  lastModified: '2024-12-06T14:58:12Z'
                  resourceType: User
        '404':
          description: Not Found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found.
                status: 404
                detail: The requested resource does not exist or you do not have access to it.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      operationId: getApiScimV2UsersByUserId
      x-operation-id-source: derived
    put:
      tags:
      - SCIM
      summary: Replace a user
      description: 'Replaces a user''s attributes, following the SCIM 2.0 protocol (RFC 7644). Server-controlled

        fields (`id`, `meta`) are ignored on the request. EPM-managed and system-managed users, and

        users shared across multiple organizations, cannot be modified (403).


        **Required scope:** `Users.Write` (Write access to users with access to SaaS Manager)'
      parameters:
      - name: userId
        in: path
        description: The user's SCIM resource ID.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUser'
            example:
              schemas:
              - urn:ietf:params:scim:schemas:core:2.0:User
              userName: erika.mustermann@example.com
              name:
                formatted: Erika Mustermann
                familyName: Mustermann
                givenName: Erika
              displayName: Erika Mustermann
              title: Customer Success Manager
              preferredLanguage: en-GB
              locale: en-GB
              active: true
              emails:
              - primary: true
                type: work
                value: erika.mustermann@example.com
              roles:
              - value: Admin
                display: Admin
                primary: false
              id: 8089ac9b31841227d4aee4f0adecd81f
              meta:
                created: '2019-01-01T00:00:00Z'
                lastModified: '2024-12-06T14:58:12Z'
                resourceType: User
        required: true
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
              example:
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
                userName: erika.mustermann@example.com
                name:
                  formatted: Erika Mustermann
                  familyName: Mustermann
                  givenName: Erika
                displayName: Erika Mustermann
                title: Customer Success Manager
                preferredLanguage: en-GB
                locale: en-GB
                active: true
                emails:
                - primary: true
                  type: work
                  value: erika.mustermann@example.com
                roles:
                - value: Admin
                  display: Admin
                  primary: false
                id: 8089ac9b31841227d4aee4f0adecd81f
                meta:
                  created: '2019-01-01T00:00:00Z'
                  lastModified: '2024-12-06T14:58:12Z'
                  resourceType: User
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '404':
          description: Not Found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found.
                status: 404
                detail: The requested resource does not exist or you do not have access to it.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '409':
          description: Conflict
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Conflict.
                status: 409
                detail: The request conflicts with the current state (for example, the resource already exists).
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - Users.Write
      operationId: putApiScimV2UsersByUserId
      x-operation-id-source: derived
    patch:
      tags:
      - SCIM
      summary: Update a user
      description: 'Applies a SCIM PATCH operation set to a user, following the SCIM 2.0 protocol (RFC 7644).

        The request body must use the SCIM PatchOp schema

        (`urn:ietf:params:scim:api:messages:2.0:PatchOp`) and supply one or more `add`/`replace`/

        `remove` operations, each with a `path`. `userName` is immutable. EPM-managed and

        system-managed users cannot be modified (403).


        **Required scope:** `Users.Write` (Write access to users with access to SaaS Manager)'
      parameters:
      - name: userId
        in: path
        description: The user's SCIM resource ID.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatch'
            example:
              schemas:
              - urn:ietf:params:scim:api:messages:2.0:PatchOp
              Operations:
              - op: replace
                path: title
                value: Senior Customer Success Manager
              - op: replace
                path: name.givenName
                value: Jonathan
              - op: replace
                path: active
                value: false
        required: true
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
              example:
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
                userName: erika.mustermann@example.com
                name:
                  formatted: Erika Mustermann
                  familyName: Mustermann
                  givenName: Erika
                displayName: Erika Mustermann
                title: Customer Success Manager
                preferredLanguage: en-GB
                locale: en-GB
                active: true
                emails:
                - primary: true
                  type: work
                  value: erika.mustermann@example.com
                roles:
                - value: Admin
                  display: Admin
                  primary: false
                id: 8089ac9b31841227d4aee4f0adecd81f
                meta:
                  created: '2019-01-01T00:00:00Z'
                  lastModified: '2024-12-06T14:58:12Z'
                  resourceType: User
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '404':
          description: Not Found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found.
                status: 404
                detail: The requested resource does not exist or you do not have access to it.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - Users.Write
      operationId: patchApiScimV2UsersByUserId
      x-operation-id-source: derived
    delete:
      tags:
      - SCIM
      summary: Delete a user
      description: 'Removes a user''s SaaS Manager access, following the SCIM 2.0 protocol (RFC 7644). Returns

        204 No Content on success. System-managed and EPM-managed users cannot be deleted (400).


        **Required scope:** `Users.Write` (Write access to users with access to SaaS Manager)'
      parameters:
      - name: userId
        in: path
        description: The user's SCIM resource ID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '404':
          description: Not Found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Not found.
                status: 404
                detail: The requested resource does not exist or you do not have access to it.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - Users.Write
      operationId: deleteApiScimV2UsersByUserId
      x-operation-id-source: derived
  /api/scim/v2/ResourceTypes/User:
    get:
      tags:
      - SCIM
      summary: Get the User resource type
      description: Returns the SCIM 2.0 "User" resource type definition (RFC 7643).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimResourceType'
              example:
                schemas:
                - urn:ietf:params:scim:schemas:core:2.0:ResourceType
                name: User
                endpoint: /api/scim/v2/User
                description: User Account
                schema: urn:ietf:params:scim:schemas:core:2.0:User
                meta:
                  location: https://app.trelica.com/api/scim/v2/ResourceTypes/User
                  resourceType: ResourceType
      operationId: getApiScimV2ResourceTypesUser
      x-operation-id-source: derived
components:
  schemas:
    Scimx509Certificate:
      type: object
      properties:
        value:
          type:
          - string
          - 'null'
        display:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        primary:
          type: boolean
      additionalProperties: false
    ScimPhoto:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    ScimName:
      type: object
      properties:
        formatted:
          type:
          - string
          - 'null'
          description: The full name formatted for display, e.g. "Ms. Barbara Jane Jensen, III".
        familyName:
          type:
          - string
          - 'null'
          description: The family (last) name of the user.
        givenName:
          type:
          - string
          - 'null'
          description: The given (first) name of the user.
        middleName:
          type:
          - string
          - 'null'
          description: The middle name(s) of the user. Combined with the given name when stored.
        honorificPrefix:
          type:
          - string
          - 'null'
        honorificSuffix:
          type:
