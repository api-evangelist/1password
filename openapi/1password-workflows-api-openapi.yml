              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - Workflows.Read
      operationId: getApiWorkflowsV1ByWorkflowId
      x-operation-id-source: derived
  /api/workflows/v1/{workflowId}/runs:
    get:
      tags:
      - Workflows
      summary: List workflow runs
      description: 'Returns a paginated list of the runs (individual executions) of a workflow, including the

        run''s context, current step states and any waiting actions. Use `filter` and

        `q` to narrow the results, and follow the `next` link to page through large

        result sets.


        **Variables:** workflow variable values are not returned by default. Pass the

        `variables` query parameter — a comma-separated list of variable IDs — to include

        those variables'' values in each run''s context. Reading the value of a **secret** (password)

        variable additionally requires the `Workflows.Runs.ReadSecrets` scope; requesting a

        secret variable without it returns `401`.


        **Required scope:** `Workflows.Runs.Read` (Read-only access to workflow runs)'
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: 'A SCIM-style filter expression restricting the items returned. See the Filtering section of the introduction for the operators and syntax; the filterable fields are listed per resource.


          **Filterable fields**


          - **string:** `context.app.id`, `context.app.name`, `context.appUser.appId`, `context.appUser.appInstanceName`, `context.appUser.appName`, `context.appUser.id`, `context.appUser.primaryExternalEmail`, `context.appUser.primaryExternalId`, `context.appUser.userEmail`, `context.appUser.userId`, `context.appUser.userName`, `context.person.email`, `context.person.id`, `context.person.lineManager.email`, `context.person.lineManager.id`, `context.person.lineManager.name`, `context.person.name`, `context.task.appliesToItemId`, `context.task.appliesToItemName`, `context.task.appliesToType`, `context.task.assignedTo.email`, `context.task.assignedTo.id`, `context.task.assignedTo.name`, `context.task.description`, `context.task.id`, `context.task.owner.email`, `context.task.owner.id`, `context.task.owner.name`, `context.task.status`, `context.task.taskTypeId`, `context.task.title`, `createdBy.email`, `createdBy.name`, `createdBy.userId`, `id`, `lastModifiedBy.email`, `lastModifiedBy.name`, `lastModifiedBy.userId`, `status`, `steps[failed.message]`, `steps[id]`, `steps[status]`

          - **date:** `context.person.leavingDate`, `context.person.startDate`, `context.task.dueDate`, `createdDtm`, `lastModifiedDtm`, `steps[completed.dtm]`, `steps[failed.dtm]`, `steps[waiting.dtm]`, `steps[waiting.untilDtm]`, `waitingUntilDtm`

          - **boolean:** `deleted`



          **Filter examples**


          - `status eq "Waiting"` — Runs that are currently waiting for input

          - `steps[status eq "Waiting"]` — Runs with a step that is waiting

          - `context.person.email eq "new.starter@example.com"` — Runs whose context person has the given email

          - `createdDtm ge "2022-01-01"` — Runs created on or after 1 Jan 2022

          - `not (waitingUntilDtm pr)` — Runs that are not waiting until a future time'
        schema:
          type: string
      - name: q
        in: query
        description: Free-text search across the resource's displayable fields.
        schema:
          type: string
      - name: since
        in: query
        description: Only return items modified at or after this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only return items modified at or before this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        description: Opaque pagination cursor supplied by SaaS Manager via the `link` response header and the `next` field.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return per page (default 100, maximum 1000).
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 100
      - name: variables
        in: query
        description: A comma-separated list of workflow variable IDs whose values should be included in each run's context. Values are omitted unless requested here. Reading a secret (password) variable additionally requires the `Workflows.Runs.ReadSecrets` scope.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunPage'
              example:
                next: https://app.trelica.com/api/workflows/v1/b7288c2c64f779e28024ea0e/runs?after=eyJpZCI6IjY2MmE4YzExZjA3YmEwYWY5YTI1Yzg2MCJ9&limit=100
                results:
                - id: 649454cc391d7e83ae7a0aa5
                  name: Shirley Lane
                  status: Completed
                  createdBy:
                    userId: a9b8c7d6-e5f4-43a2-b1c0-9a8b7c6d5e4f
                    name: Samira Johnson
                    email: samira.johnson@example.com
                  createdDtm: '2023-06-22T14:03:56.248Z'
                  deleted: false
                  lastModifiedDtm: '2023-06-22T14:04:16.157Z'
                  context:
                    person:
                      id: 67aa6cdf421044b49ad1d6dfded7bf21
                      name: Shirley Lane
                      firstName: Shirley
