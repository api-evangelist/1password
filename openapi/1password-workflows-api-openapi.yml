  /api/workflows/v1/{workflowId}/runs/{runId}/firedSignals/{activityId}/{signalName}:
    post:
      tags:
      - Workflows
      summary: Fire a signal
      description: 'Fires a named signal (for example an approval or rejection) on a workflow step that is

        currently waiting for input, allowing the run to continue. The valid signals for a waiting

        step — and the URL to call to fire each one — are listed under the step''s `waiting.actions`

