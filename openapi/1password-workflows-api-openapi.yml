openapi: 3.2.0
info:
  title: SaaS Manager Workflows API
  description: 'By accessing or using 1Password Developer Tools, you agree to the API and SDK Terms of Service. ---


    The SaaS Manager public REST API lets you read and manage your applications, people, teams, contracts, devices, workflows and audit log programmatically. Resources are grouped by area (see the navigation). The conventions below apply across the whole API. ## Regions and base URL


    SaaS Manager is hosted in multiple regions. Pick the base URL for your tenant''s region from the **Servers** dropdown — `https://app.trelica.com` (United States) or `https://eu.trelica.com` (Europe). Endpoint URLs throughout this reference use whichever server you select. ## Authentication


    Every request must send an `Authorization` header carrying an OAuth 2.0 access token, prefixed with `Bearer`:


    ```

    Authorization: Bearer

    ```


    Obtain a token using either the **Client Credentials** flow (machine-to-machine) or the **Authorization Code** flow (acting on behalf of a user). The scopes granted to your token determine which endpoints you may call — see Scopes. Access tokens expire. When a token is missing, invalid or expired you receive `401 Unauthorized`; inspect the `WWW-Authenticate` response header for detail, for example:


    ```

    Bearer error="invalid_token", error_description="The token expired at ''12/23/2020 10:27:15''"

    ```


    If you used the Authorization Code flow with the `offline_access` scope, use your refresh token to obtain a new access token. A `403 Forbidden` means the token is valid but lacks the scope required by the endpoint. ## Dates and times


    Dates and date/times are sent and returned in RFC 3339 format (essentially ISO 8601), for example `2020-12-25` (midnight) or `2020-12-25T10:50:00Z`. Field names ending in `Dtm` carry a meaningful time component; field names ending in `Date` are date-only. ## Optional fields and null


    Responses omit fields that have no value — you will see the field absent rather than returned as `null`. When creating or replacing a resource (`PUT`), any field you omit is cleared. With `PATCH`, omitting a field leaves it unchanged, whereas sending it as `null` clears it. ## Pagination


    List endpoints are paginated and return at most 100 results by default. Request a different upper bound with the `limit` query parameter (maximum 1000) — you may receive fewer than requested. Request the next page with the `after` query parameter, passing the opaque cursor token that SaaS Manager supplies. The response''s `next` field (and the `link` response header, `rel="next"`) contains the full URL for the next page:


    ```json

    {

    "next": "https://app.trelica.com/api/people/v1?after=&limit=100",

    "results": [ { /* ... */ } ]

    }

    ```


    Keep requesting pages until no further results are returned. (User data exposed over SCIM uses the SCIM `startIndex`/`count` pagination scheme instead.)


    ## Filtering


    Many list endpoints accept a `filter` query parameter (URL-encoded) based on the SCIM filtering specification. A filter is one or more expressions — an attribute name, an operator, and an optional value — combined with `and`, `or`, `not`, and grouped with parentheses. Attribute names match the JSON returned and may use dot notation for nested attributes

    (e.g. `createdBy.email`). For an attribute that is an **array of objects**, put a sub-expression in

    brackets — the item matches when *any* element satisfies it: `teams[name eq "Developers"]` or

    `teams[id eq "5f8d0a1b2c3d4e5f60718293"]`. Values are strings (double-quoted), integers, dates

    (double-quoted, RFC 3339) or booleans. Some list endpoints also accept a free-text `q` parameter

    that searches the resource''s displayable fields. Soft-deleted entities are excluded by default; include them with a filter that references `deleted` (e.g. `filter=deleted eq true`).'
  contact:
    name: 1Password SaaS Manager Support
    email: saasmanager@1password.com
  version: v1
servers:
- url: https://app.trelica.com
  description: United States
- url: https://eu.trelica.com
  description: Europe
tags:
- name: Workflows
  description: List workflows (with their triggers and steps), list their runs, and fire signals on steps that are waiting for input.
paths:
  /api/workflows/v1:
    get:
      tags:
      - Workflows
      summary: List workflows
      description: 'Returns a paginated list of the published workflows in your organization, including each

        workflow''s trigger and steps. Use `filter` and `q` to narrow the results, and

        follow the `next` link (also provided in the `link` response header) to page

        through large result sets.


        **Required scope:** `Workflows.Read` (Read-only access to workflow definitions)'
      parameters:
      - name: filter
        in: query
        description: 'A SCIM-style filter expression restricting the items returned. See the Filtering section of the introduction for the operators and syntax; the filterable fields are listed per resource.


          **Filterable fields**


          - **string:** `createdBy.email`, `createdBy.name`, `createdBy.userId`, `id`, `lastModifiedBy.email`, `lastModifiedBy.name`, `lastModifiedBy.userId`, `name`, `steps[customName]`, `steps[id]`, `steps[name]`, `steps[type]`, `trigger.dayOfWeek`, `trigger.id`, `trigger.name`, `trigger.period`, `trigger.type`

          - **number:** `trigger.everyNPeriods`, `trigger.hour`

          - **date:** `createdDtm`, `lastModifiedDtm`, `trigger.startDate`

          - **boolean:** `deleted`, `enabled`



          **Filter examples**


          - `name eq "Onboarding workflow"` — The workflow named "Onboarding workflow"

          - `name sw "Contr"` — Workflows whose name starts with "Contr", e.g. "Contractor offboarding"

          - `trigger.type eq "PersonFilter"` — Workflows triggered by a person filter

          - `enabled eq true` — Workflows that are enabled

          - `lastModifiedDtm ge "2022-01-01"` — Workflows modified on or after 1 Jan 2022

          - `deleted eq true` — Show deleted workflows (excluded by default)'
        schema:
          type: string
      - name: q
        in: query
        description: Free-text search across the resource's displayable fields.
        schema:
          type: string
      - name: since
        in: query
        description: Only return items modified at or after this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only return items modified at or before this ISO-8601 timestamp.
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        description: Opaque pagination cursor supplied by SaaS Manager via the `link` response header and the `next` field.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return per page (default 100, maximum 1000).
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
              example:
                next: https://app.trelica.com/api/workflows/v1?after=eyJpZCI6ImI3Mjg4YzJjNjRmNzc5ZTI4MDI0ZWEwZSJ9&limit=100
                results:
                - id: b7288c2c64f779e28024ea0e
                  name: Offboarding
                  enabled: true
                  createdDtm: '2023-06-22T14:02:36.136Z'
                  deleted: false
                  lastModifiedBy:
                    userId: b2c3d4e5-f678-90ab-cdef-1234567890ab
                    name: Priya Patel
                    email: priya.patel@example.com
                  lastModifiedDtm: '2023-06-22T20:28:35.846Z'
                  trigger:
                    id: 5e0e8a1c64f779e28024ea0d
                    name: Person leaves
                    type: PersonLeaves
                  steps:
                  - id: 4f2f9f6850fb2ce64a8ffb04
                    name: Create task
                    type: CreateTask
                  - id: f82c5f04e4b54a96f20ff8b5
                    name: Create Jira (Cloud) ticket
                    type: CreateExternalTask
                  - id: f9bff20456884e0f2c2f65ab
                    name: Offboard person from apps
                    type: OffboardPersonApps
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: One or more validation errors occurred.
                status: 400
                detail: The request body failed validation. See errors for the offending fields.
                errors:
                  email:
                  - The email field is required.
                traceId: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - Workflows.Read
      operationId: getApiWorkflowsV1
      x-operation-id-source: derived
  /api/workflows/v1/{workflowId}:
    get:
      tags:
      - Workflows
      summary: Get a workflow
      description: 'Returns the published workflow with the given ID, including its trigger and steps. The

        workflow is returned inside a one-item result page (empty if no workflow has that ID).


        **Required scope:** `Workflows.Read` (Read-only access to workflow definitions)'
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
              example:
                next: https://app.trelica.com/api/workflows/v1?after=eyJpZCI6ImI3Mjg4YzJjNjRmNzc5ZTI4MDI0ZWEwZSJ9&limit=100
                results:
                - id: b7288c2c64f779e28024ea0e
                  name: Offboarding
                  enabled: true
                  createdDtm: '2023-06-22T14:02:36.136Z'
                  deleted: false
                  lastModifiedBy:
