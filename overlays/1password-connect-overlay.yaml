overlay: 1.0.0
info:
  title: API Evangelist enhancements for 1Password Connect Server API
  version: 1.0.0
extends: openapi/1password-connect-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: 1password
      x-apievangelist-api: 1password-connect-api
      x-apievangelist-artifacts:
        authentication: authentication/1password-authentication.yml
        errors: errors/1password-problem-types.yml
        conventions: conventions/1password-conventions.yml
        data-model: data-model/1password-data-model.yml
        lifecycle: lifecycle/1password-lifecycle.yml
  - target: $.info
    update:
      x-apievangelist-auth: bearer-token (Connect server access token, JWT)
      x-apievangelist-deployment: self-hosted (Connect server runs in your own infrastructure)
