overlay: 1.0.0
info:
  title: API Evangelist enhancements for 1Password Events API
  version: 1.0.0
extends: openapi/1password-events-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: 1password
      x-apievangelist-api: 1password-events-api
      x-apievangelist-artifacts:
        authentication: authentication/1password-authentication.yml
        errors: errors/1password-problem-types.yml
        conventions: conventions/1password-conventions.yml
        lifecycle: lifecycle/1password-lifecycle.yml
        changelog: changelog/1password-changelog.yml
  - target: $.info
    update:
      x-apievangelist-pagination: cursor (POST body cursor + has_more)
      x-apievangelist-rate-limit: 429 Too Many Requests signaled per host region
