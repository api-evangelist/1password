overlay: 1.0.0
info:
  title: API Evangelist enhancements for 1Password Partnership API
  version: 1.0.0
extends: openapi/1password-partnership-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: 1password
      x-apievangelist-api: 1password-partnership-api
      x-apievangelist-artifacts:
        authentication: authentication/1password-authentication.yml
        errors: errors/1password-problem-types.yml
        conventions: conventions/1password-conventions.yml
        data-model: data-model/1password-data-model.yml
  - target: $.info
    update:
      x-apievangelist-scope: partner billing accounts for individual/family accounts only (not team/business)
      x-apievangelist-error-envelope: "{ status, message, code }"
